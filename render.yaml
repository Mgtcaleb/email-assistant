services:
  - type: web
    name: openclaw-amazon-slack
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /startupz
    envVars:
      - key: PORT
        value: "8080"
      - key: OPENCLAW_GATEWAY_PORT
        value: "8080"
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: DATA_DIR
        value: /data
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: AMAZON_MARKETS
        value: amazon.in,amazon.com
      - key: POLL_SECONDS
        value: "300"
      - key: INITIAL_LOOKBACK_DAYS
        value: "30"
      - key: DRY_RUN
        value: "true"
    disk:
      name: openclaw-amazon-data
      mountPath: /data
      sizeGB: 1
